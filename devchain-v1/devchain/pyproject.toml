[project]
name = "devchain"
version = "0.1.0"
description = "Development chain for this repo: Codex builds plan packages, Claude reviews, QA with Playwright"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
devchain = "devchain.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
